  <!-- Text lines representing content -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <!-- Name/Title -->
    <line x1="18" y1="20" x2="46" y2="20"/>
    <line x1="18" y1="24" x2="46" y2="24"/>

    <!-- First section -->
    <line x1="18" y1="32" x2="42" y2="32"/>
    <line x1="18" y1="36" x2="40" y2="36"/>
    <line x1="18" y1="40" x2="38" y2="40"/>

    <!-- Second section -->
    <line x1="18" y1="48" x2="42" y2="48"/>
    <line x1="18" y1="52" x2="40" y2="52"/>
  </g>
</svg>