<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Document background -->
  <rect x="12" y="8" width="40" height="48" rx="2" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>

  <!-- Document highlight -->
